{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Psicopedia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: 'Inter', sans-serif; 
            background-color: #FDF9F1; 
            background-image: 
                radial-gradient(at 0% 0%, #F5EBE0 0px, transparent 50%),
                radial-gradient(at 100% 100%, #EADDCB 0px, transparent 50%);
            color: #2D241E; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .dot-matrix {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        .header-container { text-align: center; margin-bottom: 40px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo-box { width: 140px; height: 140px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; box-shadow: 0 15px 35px rgba(198, 142, 88, 0.25); border: 4px solid #FFFFFF; z-index: 2; }

        .logo-text { margin: 0; font-size: 3.5em; font-weight: 800; letter-spacing: 3px; background: linear-gradient(to right, #431407, #9A3412); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 10px rgba(154, 52, 18, 0.15)); }
        .logo-tagline { background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(0,0,0,0.05); padding: 8px 30px; border-radius: 30px; color: #78716C; font-size: 0.85em; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 10px; }

        .login-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,1); border-radius: 24px; padding: 40px 45px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px rgba(139, 115, 85, 0.15); color: #292524; z-index: 1; }

        .input-group { text-align: left; margin-bottom: 25px; }
        .input-label { display: block; color: #78716C; font-size: 0.75em; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .input-field { width: 100%; padding: 14px 16px; background: #FAFAF9; border: 1px solid #E7E5E4; border-radius: 8px; color: #292524; font-size: 1.05em; font-weight: 600; outline: none; transition: all 0.3s ease; font-family: 'Inter', sans-serif; }
        .input-field:focus { box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); border-color: #F59E0B; background: #FFFFFF; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #D97706, #B45309); color: white; border: none; padding: 14px; font-size: 1.05em; font-weight: 800; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; margin-top: 5px; margin-bottom: 25px; box-shadow: 0 8px 20px rgba(180, 83, 9, 0.25); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(180, 83, 9, 0.35); filter: brightness(1.1); }

        .enlace-registro { display: block; color: #78716C; text-decoration: none; font-size: 0.85em; font-weight: 600; transition: color 0.3s; }
        .enlace-registro strong { color: #B45309; font-weight: 800; }
        .enlace-registro:hover strong { color: #D97706; }
        
        .error-msg { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; padding: 12px; border-radius: 8px; margin-bottom: 25px; font-size: 0.95em; font-weight: 700; text-align: center;}

        @media (max-width: 650px) {
            .logo-text { font-size: 2.5em; }
            .logo-box { width: 100px; height: 100px; }
            .login-card { padding: 35px 25px; }
        }
    </style>
</head>
<body>
    <div class="dot-matrix"></div>

    <div class="header-container">
        <div class="logo-box">
            <img src="{% static 'img/logo1.jpeg' %}" alt="Logo Psicopedia" onerror="this.style.display='none'; this.parentNode.innerHTML='🧠';">
        </div>
        <h1 class="logo-text">PSICOPEDIA</h1>
        <div class="logo-tagline">Ingresa a tu cuenta</div>
    </div>

    <div class="login-card">
        
        <!-- ESTO TE AVISARÁ SI EL USUARIO NO EXISTE O HAY ERROR (VERSIÓN LIMPIA) -->
        {% if form.errors %}
            <div class="error-msg">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="input-group">
                <label class="input-label">Nombre de usuario</label>
                <input type="text" name="username" class="input-field" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label class="input-label">Contraseña</label>
                <input type="password" name="password" class="input-field" required>
            </div>
            
            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
        
        <a href="{% url 'registro' %}" class="enlace-registro">¿No tienes cuenta? <strong>Regístrate aquí</strong></a>
    </div>
</body>
</html>
