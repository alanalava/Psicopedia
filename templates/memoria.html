<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parejas Psicopédicas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { 
margin: 0; font-family: 'Inter', sans-serif; 
background-color: #FDF9F1;
background-image: radial-gradient(at 0% 0%, #F5EBE0 0px, transparent 50%), radial-gradient(at 100% 100%, #EADDCB 0px, transparent 50%);
color: #1C1917; display: flex; flex-direction: column; align-items: center; min-height: 100vh; position: relative;
}

.dot-matrix {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
background-size: 30px 30px;
z-index: -1;
pointer-events: none;
}

.hud-top { width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #E7E5E4; position: sticky; top: 0; z-index: 100; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
.stat-box { background: #FAFAF9; padding: 10px 20px; border-radius: 12px; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #1C1917; border: 1px solid #E7E5E4;}

.btn-salir { color: #78716C; text-decoration: none; font-weight: 600; transition: 0.3s; }
.btn-salir:hover { color: #D97706; }

.tablero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 900px; width: 100%; padding: 40px 20px; margin-top: 20px;}

/* Efecto 3D de las cartas */
.carta { perspective: 1000px; width: 100%; aspect-ratio: 1; cursor: pointer; }
.carta-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
.carta.volteada .carta-inner { transform: rotateY(180deg); }

.carta-front, .carta-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; box-shadow: 0 15px 30px rgba(139,115,85,0.15); }

/* La parte de atrás de la carta (lo que ves primero) */
.carta-front { background: linear-gradient(135deg, #D97706, #B45309); font-size: 3em; border: 2px solid #FEF3C7; }

/* La cara de la carta (el texto) */
.carta-back { background: #ffffff; color: #1C1917; transform: rotateY(180deg); font-weight: 800; font-size: 1.1em; border: 4px solid #D97706; }
.carta.resuelta .carta-back { background: #ecfdf5; border-color: #10b981; color: #059669; }

.alerta-victoria { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFFFFF; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 25px 50px rgba(139,115,85,0.2); border: 1px solid #E7E5E4; display: none; z-index: 200;}
.alerta-victoria h2 { margin: 0 0 15px 0; font-size: 2em; color: #1C1917;}
.btn-jugar { background: linear-gradient(135deg, #D97706, #B45309); color: white; padding: 15px 30px; border: none; border-radius: 12px; font-weight: 800; font-size: 1.1em; cursor: pointer; margin-top: 20px; box-shadow: 0 8px 20px rgba(180, 83, 9, 0.25); transition: 0.3s;}
.btn-jugar:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(180, 83, 9, 0.35); filter: brightness(1.1); }

@media (max-width: 650px) {
.tablero { grid-template-columns: repeat(2, 1fr); gap: 10px; }
.carta-back { font-size: 0.9em; }
}
</style>
</head>
<body>
<div class="dot-matrix"></div>

<div class="hud-top">
<a href="{% url 'escritorio' %}" class="btn-salir">← Volver al Escritorio</a>
<div class="stat-box">🏆 <span id="ui-xp" style="color: #D97706;">{{ perfil.xp }}</span> XP</div>
</div>

<div class="tablero" id="tablero"></div>

<div class="alerta-victoria" id="alerta-victoria">
<h2>¡Excelente Memoria! 🧠</h2>
<p id="mensaje-xp" style="font-size: 1.2em; font-weight: 600; color: #78716C;"></p>
<button class="btn-jugar" onclick="iniciarJuego()">Jugar de Nuevo</button>
</div>

<script>
const csrftoken = '{{ csrf_token }}';
let primeraCarta = null;
let segundaCarta = null;
let bloquearTablero = false;
let paresEncontrados = 0;

// Función auxiliar para quitar el texto entre paréntesis (ej...)
function limpiarTextoCarta(texto) {
// Elimina todo lo que esté entre paréntesis y cualquier espacio sobrante
return texto.replace(/\(.*?\)/g, '').trim();
}

function iniciarJuego() {
document.getElementById('alerta-victoria').style.display = 'none';
const tablero = document.getElementById('tablero');
tablero.innerHTML = '';
paresEncontrados = 0;
primeraCarta = null;
segundaCarta = null;
bloquearTablero = false;

// TRUCO ANTI-CACHÉ: Le agregamos una variable de tiempo para forzar cartas nuevas
const urlCartas = `/api/memoria/cartas/?t=${new Date().getTime()}`;

fetch(urlCartas)
.then(res => res.json())
.then(data => {
data.cartas.forEach(carta => {
const div = document.createElement('div');
div.className = 'carta';
div.dataset.match = carta.id_match;
// Aplicamos la limpieza al texto antes de inyectarlo
const textoLimpio = limpiarTextoCarta(carta.texto);
div.innerHTML = `
<div class="carta-inner">
<div class="carta-front">🃏</div>
<div class="carta-back">${textoLimpio}</div>
</div>
`;
div.addEventListener('click', voltearCarta);
tablero.appendChild(div);
});
});
}

function voltearCarta() {
if (bloquearTablero) return;
if (this === primeraCarta) return; // Evita doble clic en la misma carta

this.classList.add('volteada');

if (!primeraCarta) {
primeraCarta = this;
return;
}

segundaCarta = this;
verificarPar();
}

function verificarPar() {
let esMatch = primeraCarta.dataset.match === segundaCarta.dataset.match;

if (esMatch) {
deshabilitarCartas();
paresEncontrados++;
if (paresEncontrados === 4) {
registrarVictoria();
}
} else {
desvoltearCartas();
}
}

function deshabilitarCartas() {
primeraCarta.removeEventListener('click', voltearCarta);
segundaCarta.removeEventListener('click', voltearCarta);
// Efecto visual de que ya están resueltas
primeraCarta.classList.add('resuelta');
segundaCarta.classList.add('resuelta');
resetearTablero();
}

function desvoltearCartas() {
bloquearTablero = true;
setTimeout(() => {
primeraCarta.classList.remove('volteada');
segundaCarta.classList.remove('volteada');
resetearTablero();
}, 1200); // 1.2 segundos para memorizar
}

function resetearTablero() {
[primeraCarta, segundaCarta, bloquearTablero] = [null, null, false];
}

function registrarVictoria() {
fetch('/api/memoria/victoria/', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'X-CSRFToken': csrftoken
}
})
.then(res => res.json())
.then(data => {
document.getElementById('ui-xp').innerText = data.xp_total;
document.getElementById('mensaje-xp').innerText = data.mensaje;
setTimeout(() => {
document.getElementById('alerta-victoria').style.display = 'block';
}, 800);
});
}

window.onload = iniciarJuego;
</script>
</body>
</html>
