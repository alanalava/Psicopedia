<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Psicopedia - Simulador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: #FDF9F1; 
            background-image: radial-gradient(at 0% 0%, #F5EBE0 0px, transparent 50%), radial-gradient(at 100% 100%, #EADDCB 0px, transparent 50%);
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            position: relative;
        }
        
        .dot-matrix {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* BARRA LATERAL ESTANDARIZADA (Modo Claro) */
        .sidebar { width: 320px; background: #FFFFFF; border-right: 1px solid #E7E5E4; display: none; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.02); z-index: 10;}
        .sidebar-header { padding: 25px 20px; background: #FAFAF9; text-align: center; border-bottom: 2px solid #D97706; }
        .sidebar-header h2 { margin: 0; font-size: 1.4em; font-weight: 900; color: #1C1917; letter-spacing: 1px;}
        .sidebar-header h2 span { color: #D97706; }
        .sidebar-content { overflow-y: auto; flex-grow: 1; padding-bottom: 20px; }
        .titulo-seccion { margin: 20px 15px 10px 15px; color: #78716C; padding-bottom: 5px; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
        .grid-preguntas { padding: 5px 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        
        .btn-nav-pregunta { background: #FAFAF9; color: #44403C; border: 1px solid #E7E5E4; border-radius: 8px; padding: 10px 0; font-weight: 700; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 0.9em; }
        .btn-nav-pregunta:hover { background: #FFFFFF; border-color: #D6D3D1; transform: translateY(-2px);}
        .btn-nav-pregunta.actual { border: 2px solid #D97706; background: #FEF3C7; color: #92400E; transform: scale(1.1); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2);}
        .btn-nav-pregunta.respondida { background: #10b981; color: white; border-color: #059669;}

        /* CONTENIDO PRINCIPAL */
        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; padding: 50px 20px; overflow-y: auto; z-index: 1;}
        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid #FFFFFF; border-radius: 24px; padding: 50px; box-shadow: 0 25px 50px rgba(139, 115, 85, 0.15); width: 100%; max-width: 850px; border-top: 6px solid #D97706; }
        
        /* CABECERA PREGUNTA */
        .header-pregunta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #E7E5E4; padding-bottom: 15px;}
        .indicador-numero { color: #78716C; font-weight: 800; font-size: 1.1em; letter-spacing: 0.5px;}
        .etiqueta-seccion { background: #FEF3C7; color: #9A3412; padding: 6px 14px; border-radius: 20px; font-size: 0.85em; font-weight: 800; border: 1px solid #FDE68A;}
        h2 { color: #1C1917; font-size: 1.6em; line-height: 1.5; margin-top: 0; font-weight: 900;}
        
        /* OPCIONES (DENTRO DEL QUIZ) */
        .btn-opcion { display: block; width: 100%; padding: 18px 25px; margin: 12px 0; border: 1px solid #E7E5E4; border-radius: 14px; background: #FAFAF9; font-size: 16px; cursor: pointer; transition: all 0.2s ease; text-align: left; color: #44403C; font-weight: 600; line-height: 1.4;}
        .btn-opcion:hover { background: #FFFFFF; border-color: #D6D3D1; transform: translateX(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.03);}
        .btn-opcion.seleccionada { background: #FEF3C7; border-color: #F59E0B; color: #9A3412; font-weight: 800; transform: translateX(5px); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.15); border-width: 2px; }
        .btn-opcion.seleccionada::before { content: '•'; color: #F59E0B; font-size: 1.5em; margin-right: 10px; line-height: 0;}

        /* CONTROLES INFERIORES */
        .controles { display: flex; justify-content: space-between; margin-top: 40px; }
        .btn-control { padding: 14px 28px; font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; border: none; transition: 0.3s ease; text-decoration: none;}
        .btn-anterior { background: #FAFAF9; color: #44403C; border: 1px solid #E7E5E4;}
        .btn-anterior:hover { background: #FFFFFF; border-color: #D6D3D1; transform: translateY(-2px);}
        .btn-siguiente { background: linear-gradient(135deg, #D97706, #B45309); color: white; box-shadow: 0 8px 20px rgba(180, 83, 9, 0.25);}
        .btn-siguiente:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(180, 83, 9, 0.35); filter: brightness(1.1);}
        .btn-finalizar { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);}
        .btn-finalizar:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(16, 185, 129, 0.35); filter: brightness(1.1);}

        /* ========================================= */
        /* MENÚ DE SELECCIÓN ESTILO PREMIUM          */
        /* ========================================= */
        #lista-secciones { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 30px;}
        
        .card-simulador { background: #FFFFFF; border-radius: 20px; padding: 25px 20px; text-align: center; cursor: pointer; border: 1px solid #E7E5E4; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 10px 25px rgba(139, 115, 85, 0.05);}
        .card-simulador:hover { transform: translateY(-5px); border-color: #D6D3D1; box-shadow: 0 15px 35px rgba(139, 115, 85, 0.15); }
        
        .simulador-icon-wrapper { width: 65px; height: 65px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2em; margin-bottom: 15px; transition: transform 0.3s ease; color: white; }
        .card-simulador:hover .simulador-icon-wrapper { transform: scale(1.1) rotate(5deg); }
        
        .simulador-titulo { font-size: 1.1em; font-weight: 800; color: #1C1917; margin: 0 0 12px 0; line-height: 1.3;}
        .simulador-badge { background: #FAFAF9; color: #78716C; padding: 6px 12px; border-radius: 12px; font-size: 0.85em; font-weight: 800; border: 1px solid #E7E5E4;}

        /* Tarjeta Especial: Simulador Global */
        .card-global { grid-column: 1 / -1; background: linear-gradient(135deg, #D97706, #B45309); color: white; border: none; flex-direction: row; justify-content: space-between; padding: 25px 30px;}
        .card-global:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(180, 83, 9, 0.3); }
        .card-global .simulador-icon-wrapper { background: rgba(255,255,255,0.2) !important; box-shadow: none !important; margin: 0; width: 55px; height: 55px; font-size: 1.6em;}
        .card-global .simulador-titulo { color: white; font-size: 1.4em; margin-bottom: 5px; text-align: left;}
        .card-global .simulador-badge { background: rgba(255,255,255,0.2); color: white; border: none;}

        /* ========================================= */
        /* ESTILOS DE RESULTADOS PREMIUM CLAROS      */
        /* ========================================= */
        #resultados-container {
            border-top: none;
            background: #FFFFFF;
        }

        .header-resultados {
            text-align: center;
            margin-bottom: 50px;
            padding: 40px 20px;
            border-radius: 20px;
            background: #FAFAF9; 
            border: 1px solid #E7E5E4;
            color: #1C1917;
            position: relative;
            overflow: hidden;
        }

        .header-resultados h2 { color: #1C1917; font-size: 2.8em; margin: 0 0 15px 0; font-weight: 900; position: relative; z-index: 1; }

        .medalla-calificacion {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #FFFFFF;
            padding: 12px 30px;
            border-radius: 100px;
            border: 2px solid #E7E5E4;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .medalla-calificacion h3 { margin: 0; font-size: 1.6em; font-weight: 900;}
        .medalla-calificacion span { font-size: 1.6em; }

        /* Tarjetas de Revisión de Preguntas */
        .caja-evaluacion { 
            margin-top: 25px; 
            padding: 30px; 
            border-radius: 16px; 
            background: #FAFAF9;
            border: 1px solid #E7E5E4;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .caja-evaluacion:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); background: #FFFFFF;}

        .caja-evaluacion.correcto { border-left: 6px solid #10b981; }
        .caja-evaluacion.incorrecto { border-left: 6px solid #ef4444; }
        
        .badge-estado {
            position: absolute;
            top: -12px;
            right: 30px;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .badge-correcto { background: #10b981; color: white; }
        .badge-incorrecto { background: #ef4444; color: white; }

        .eval-pregunta { font-size: 1.2em; color: #1C1917; font-weight: 800; margin: 0 0 15px 0; padding-right: 80px; }
        .eval-user-ans { font-size: 1.1em; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 600;}

        .texto-correcto { color: #059669; font-weight: 800; background: #ecfdf5; padding: 4px 10px; border-radius: 8px; border: 1px solid #A7F3D0;}
        .texto-incorrecto { color: #DC2626; font-weight: 800; background: #fff1f2; padding: 4px 10px; border-radius: 8px; border: 1px solid #FECACA;}

        .explicacion-box {
            background: #FFFFFF;
            padding: 18px 25px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #E7E5E4;
            border-left: 4px solid #D97706;
            color: #44403C;
            font-size: 1.05em;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .explicacion-box span { font-size: 1.5em; }

        @media (max-width: 768px) {
            .card-global { flex-direction: column; text-align: center; justify-content: center; gap: 15px; }
            .card-global .simulador-titulo { text-align: center; }
            .sidebar { position: absolute; height: 100%; width: 260px; }
            .eval-pregunta { padding-right: 0; margin-top: 15px; }
        }
    </style>
</head>
<body>
    <div class="dot-matrix"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>PSICO<span>PEDIA</span></h2>
            <p style="font-size: 0.8em; margin-top: 5px; color: #A8A29E; font-weight: 800; text-transform: uppercase;">Simulador Clínico</p>
        </div>
        <div id="sidebar-content" class="sidebar-content"></div>
    </div>

    <div class="main-content">
        <!-- MENÚ DE SELECCIÓN -->
        <div class="card" id="pantalla-seleccion" style="border-top-color: #D97706;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 style="color: #1C1917; margin: 0;">Configura tu Examen</h2>
                <a href="{% url 'escritorio' %}" class="btn-control btn-anterior" style="font-size: 0.9em; padding: 10px 20px;">← Escritorio</a>
            </div>
            <p style="color: #78716C; margin-bottom: 10px; font-size: 1.1em; line-height: 1.5; font-weight: 500;">Selecciona un módulo específico para enfocar tu estudio, o desafíate con el banco oficial completo.</p>
            
            <div id="lista-secciones"></div>
        </div>

        <!-- CUESTIONARIO -->
        <div class="card" id="quiz-container" style="display:none;">
            <div class="header-pregunta">
                <span class="indicador-numero" id="indicador-pregunta">Pregunta 1</span>
                <span class="etiqueta-seccion" id="indicador-seccion">Sección</span>
            </div>
            
            <h2 id="pregunta-texto">Cargando...</h2>
            <div id="opciones-container"></div>

            <div class="controles">
                <button class="btn-control btn-anterior" id="btn-anterior" onclick="cambiarPregunta(-1)">← Anterior</button>
                <button class="btn-control btn-siguiente" id="btn-siguiente" onclick="cambiarPregunta(1)">Siguiente →</button>
                <button class="btn-control btn-finalizar" id="btn-finalizar" style="display:none;" onclick="mostrarResultados()">Entregar Examen</button>
            </div>
        </div>

        <!-- RESULTADOS FINALES -->
        <div class="card" id="resultados-container" style="display:none;">
            <div class="header-resultados">
                <h2 id="titulo-resultados">¡Examen Finalizado!</h2>
                <div class="medalla-calificacion">
                    <span id="medalla-emoji">🎯</span>
                    <h3 id="puntuacion-final">Calificación: 0%</h3>
                </div>
            </div>
            
            <h3 style="color: #1C1917; margin-bottom: 25px; font-size: 1.5em; border-bottom: 2px solid #E7E5E4; padding-bottom: 15px; font-weight: 900;">Revisión Detallada</h3>
            <div id="revision-respuestas"></div>
            
            <div style="text-align: center; margin-top: 50px;">
                <button class="btn-control btn-anterior" onclick="location.href='/'" style="margin-right: 15px;">← Volver al Escritorio</button>
                <button class="btn-control btn-siguiente" onclick="location.reload()">Configurar Nuevo Examen ↻</button>
            </div>
        </div>
    </div>

    <script>
        let todasLasSecciones = []; 
        let datosCrudos = [];       
        let preguntas = [];         
        let indiceActual = 0;
        let respuestasUsuario = []; 

        const diccIconos = [
            { palabra: 'conciencia', emoji: '👁️', gradiente: 'linear-gradient(135deg, #8b5cf6, #6366f1)', sombra: 'rgba(139, 92, 246, 0.4)' },
            { palabra: 'orientación', emoji: '🧭', gradiente: 'linear-gradient(135deg, #f59e0b, #d97706)', sombra: 'rgba(245, 158, 11, 0.4)' },
            { palabra: 'atención', emoji: '🎯', gradiente: 'linear-gradient(135deg, #ef4444, #b91c1c)', sombra: 'rgba(239, 68, 68, 0.4)' },
            { palabra: 'memoria', emoji: '🕰️', gradiente: 'linear-gradient(135deg, #10b981, #059669)', sombra: 'rgba(16, 185, 129, 0.4)' },
            { palabra: 'percepción', emoji: '🌌', gradiente: 'linear-gradient(135deg, #d946ef, #a21caf)', sombra: 'rgba(217, 70, 239, 0.4)' },
            { palabra: 'pensamiento', emoji: '💭', gradiente: 'linear-gradient(135deg, #0ea5e9, #0284c7)', sombra: 'rgba(14, 165, 233, 0.4)' },
            { palabra: 'lenguaje', emoji: '🗣️', gradiente: 'linear-gradient(135deg, #f43f5e, #e11d48)', sombra: 'rgba(244, 63, 94, 0.4)' },
            { palabra: 'afectiv', emoji: '🎭', gradiente: 'linear-gradient(135deg, #ec4899, #be185d)', sombra: 'rgba(236, 72, 153, 0.4)' },
            { palabra: 'comportamiento', emoji: '⚡', gradiente: 'linear-gradient(135deg, #f97316, #ea580c)', sombra: 'rgba(249, 115, 22, 0.4)' },
            { palabra: 'fisiológicas', emoji: '🛌', gradiente: 'linear-gradient(135deg, #64748b, #475569)', sombra: 'rgba(100, 116, 139, 0.4)' },
            { palabra: 'relación', emoji: '🤝', gradiente: 'linear-gradient(135deg, #14b8a6, #0d9488)', sombra: 'rgba(20, 184, 166, 0.4)' },
            
            { palabra: 'psicopático', emoji: '🛑', gradiente: 'linear-gradient(135deg, #dc2626, #991b1b)', sombra: 'rgba(220, 38, 38, 0.4)' },
            { palabra: 'agudos', emoji: '🌩️', gradiente: 'linear-gradient(135deg, #facc15, #ca8a04)', sombra: 'rgba(202, 138, 4, 0.4)' },
            { palabra: 'crónicos', emoji: '⏳', gradiente: 'linear-gradient(135deg, #9ca3af, #4b5563)', sombra: 'rgba(75, 85, 99, 0.4)' },
            { palabra: 'discinéticos', emoji: '🌪️', gradiente: 'linear-gradient(135deg, #2dd4bf, #0f766e)', sombra: 'rgba(15, 118, 110, 0.4)' },
            { palabra: 'delirante', emoji: '🌀', gradiente: 'linear-gradient(135deg, #c084fc, #7e22ce)', sombra: 'rgba(126, 34, 206, 0.4)' },
            { palabra: 'esquizofrénico', emoji: '🧩', gradiente: 'linear-gradient(135deg, #84cc16, #4d7c0f)', sombra: 'rgba(77, 124, 15, 0.4)' },
            { palabra: 'hipocondríaco', emoji: '🩺', gradiente: 'linear-gradient(135deg, #38bdf8, #0369a1)', sombra: 'rgba(3, 105, 161, 0.4)' },
            { palabra: 'asténico', emoji: '🪫', gradiente: 'linear-gradient(135deg, #94a3b8, #334155)', sombra: 'rgba(51, 65, 85, 0.4)' },
            
            { palabra: 'síndrome', emoji: '📋', gradiente: 'linear-gradient(135deg, #334155, #0f172a)', sombra: 'rgba(51, 65, 85, 0.4)' }
        ];

        fetch('/api/cuestionario/')
            .then(response => response.json())
            .then(data => {
                todasLasSecciones = data.secciones;
                construirMenuSeleccion();
            })
            .catch(error => console.error("Error cargando la API: ", error));

        function construirMenuSeleccion() {
            const lista = document.getElementById('lista-secciones');
            lista.innerHTML = '';

            let totalPreguntas = todasLasSecciones.reduce((acc, sec) => acc + sec.preguntas.length, 0);

            const divGlobal = document.createElement('div');
            divGlobal.className = 'card-simulador card-global';
            divGlobal.innerHTML = `
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="simulador-icon-wrapper">🚀</div>
                    <div>
                        <h3 class="simulador-titulo">Simulador Global (Mazo Completo)</h3>
                        <div style="color: #FEF3C7; font-size: 0.9em; font-weight: 600;">Prueba definitiva mezclando todas las unidades</div>
                    </div>
                </div>
                <div class="simulador-badge">${totalPreguntas} preguntas</div>
            `;
            divGlobal.onclick = () => iniciarQuiz(todasLasSecciones);
            lista.appendChild(divGlobal);

            todasLasSecciones.forEach(seccion => {
                const div = document.createElement('div');
                div.className = 'card-simulador';
                
                let nombreLower = seccion.nombre.toLowerCase();
                let asignado = { emoji: '🧩', gradiente: 'linear-gradient(135deg, #D97706, #B45309)', sombra: 'rgba(180, 83, 9, 0.2)' }; 
                for(let item of diccIconos) {
                    if(nombreLower.includes(item.palabra)) {
                        asignado = item;
                        break;
                    }
                }

                div.innerHTML = `
                    <div class="simulador-icon-wrapper" style="background: ${asignado.gradiente}; box-shadow: 0 10px 15px ${asignado.sombra};">
                        ${asignado.emoji}
                    </div>
                    <h3 class="simulador-titulo">${seccion.nombre}</h3>
                    <div class="simulador-badge">${seccion.preguntas.length} preg.</div>
                `;
                div.onclick = () => iniciarQuiz([seccion]); 
                lista.appendChild(div);
            });
        }

        function iniciarQuiz(seccionesElegidas) {
            datosCrudos = seccionesElegidas;
            preguntas = [];
            
            datosCrudos.forEach(seccion => {
                seccion.preguntas.forEach(p => {
                    p.seccion_nombre = seccion.nombre;
                    preguntas.push(p);
                });
            });
            
            preguntas.sort(() => Math.random() - 0.5);

            respuestasUsuario = new Array(preguntas.length).fill(null);
            indiceActual = 0;
            
            document.getElementById('pantalla-seleccion').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('quiz-container').style.display = 'block';

            construirSidebar();
            renderizarPregunta();
        }

        function construirSidebar() {
            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = '';
            
            // No Simulador Global (adu a seksion), mangaramid iti maymaysa a listaan a naurnos
            if (datosCrudos.length > 1) {
                const titulo = document.createElement('h4');
                titulo.className = 'titulo-seccion';
                titulo.innerText = 'SIMULador GLOBAL MIXTO';
                sidebarContent.appendChild(titulo);
                
                const grid = document.createElement('div');
                grid.className = 'grid-preguntas';
                
                preguntas.forEach((pregReal, idxReal) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-nav-pregunta';
                    btn.innerText = idxReal + 1; 
                    btn.id = `nav-btn-${idxReal}`;
                    btn.onclick = () => irAPregunta(idxReal);
                    grid.appendChild(btn);
                });
                sidebarContent.appendChild(grid);
            } else {
                // No maymaysa a yunit, ipakitana a normal
                datosCrudos.forEach(seccion => {
                    const titulo = document.createElement('h4');
                    titulo.className = 'titulo-seccion';
                    titulo.innerText = seccion.nombre;
                    sidebarContent.appendChild(titulo);
                    
                    const grid = document.createElement('div');
                    grid.className = 'grid-preguntas';
                    
                    let pregDeEstaSeccion = preguntas.filter(p => p.seccion_nombre === seccion.nombre);
                    
                    pregDeEstaSeccion.forEach(pregReal => {
                        let idxReal = preguntas.indexOf(pregReal);
                        const btn = document.createElement('button');
                        btn.className = 'btn-nav-pregunta';
                        btn.innerText = idxReal + 1; 
                        btn.id = `nav-btn-${idxReal}`;
                        btn.onclick = () => irAPregunta(idxReal);
                        grid.appendChild(btn);
                    });
                    sidebarContent.appendChild(grid);
                });
            }
        }

        function renderizarPregunta() {
            const pregunta = preguntas[indiceActual];
            document.getElementById('indicador-pregunta').innerText = `Pregunta ${indiceActual + 1} de ${preguntas.length}`;
            document.getElementById('indicador-seccion').innerText = pregunta.seccion_nombre;
            document.getElementById('pregunta-texto').innerText = pregunta.texto;

            preguntas.forEach((_, i) => {
                const btn = document.getElementById(`nav-btn-${i}`);
                if(btn) {
                    btn.classList.remove('actual');
                    if (i === indiceActual) btn.classList.add('actual');
                    if (respuestasUsuario[i] !== null) btn.classList.add('respondida');
                }
            });

            const contenedorOpciones = document.getElementById('opciones-container');
            contenedorOpciones.innerHTML = ''; 

            pregunta.opciones.forEach(opcion => {
                const boton = document.createElement('button');
                boton.className = 'btn-opcion';
                boton.innerText = opcion.texto;
                
                if (respuestasUsuario[indiceActual] && respuestasUsuario[indiceActual].texto === opcion.texto) {
                    boton.classList.add('seleccionada');
                }

                boton.onclick = () => seleccionarOpcion(opcion);
                contenedorOpciones.appendChild(boton);
            });

            document.getElementById('btn-anterior').style.visibility = (indiceActual === 0) ? 'hidden' : 'visible';
            
            if (indiceActual === preguntas.length - 1) {
                document.getElementById('btn-siguiente').style.display = 'none';
                document.getElementById('btn-finalizar').style.display = 'block';
            } else {
                document.getElementById('btn-siguiente').style.display = 'block';
                document.getElementById('btn-finalizar').style.display = 'none';
            }
        }

        function seleccionarOpcion(opcion) {
            respuestasUsuario[indiceActual] = opcion;
            renderizarPregunta(); 
        }

        function cambiarPregunta(direccion) {
            indiceActual += direccion;
            renderizarPregunta();
        }

        function irAPregunta(indice) {
            indiceActual = indice;
            renderizarPregunta();
        }

        // ==========================================
        // NUEVA FUNCIÓN MOSTRAR RESULTADOS (ESTILO PREMIUM)
        // ==========================================
        function mostrarResultados() {
            document.getElementById('sidebar').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('resultados-container').style.display = 'block';

            let aciertos = 0;
            const contenedorRevision = document.getElementById('revision-respuestas');
            contenedorRevision.innerHTML = '';

            preguntas.forEach((pregunta, index) => {
                const respuesta = respuestasUsuario[index];
                const div = document.createElement('div');
                
                let respondioBien = false;
                let textoRespuesta = "No respondida";

                if (respuesta) {
                    respondioBien = respuesta.es_correcta;
                    textoRespuesta = respuesta.texto;
                    if (respondioBien) aciertos++;
                }

                div.className = `caja-evaluacion ${respondioBien ? 'correcto' : 'incorrecto'}`;
                
                let badgeHTML = respondioBien 
                    ? `<div class="badge-estado badge-correcto">✓ Correcto</div>` 
                    : `<div class="badge-estado badge-incorrecto">✗ Incorrecto</div>`;

                let explicacionHTML = !respondioBien 
                    ? `<div class="explicacion-box">
                         <span>💡</span>
                         <div>
                            <strong style="display:block; margin-bottom: 5px; color: #92400E;">Corrección Oficial:</strong> 
                            <span style="font-weight: 700;">${pregunta.explicacion}</span>
                         </div>
                       </div>` 
                    : '';

                div.innerHTML = `
                    ${badgeHTML}
                    <h4 class="eval-pregunta">${index + 1}. ${pregunta.texto}</h4>
                    <p class="eval-user-ans">Tu respuesta: <span class="${respondioBien ? 'texto-correcto' : 'texto-incorrecto'}">${textoRespuesta}</span></p>
                    ${explicacionHTML}
                `;
                contenedorRevision.appendChild(div);
            });

            // Configurar el Header de Resultados según la puntuación
            const porcentaje = Math.round((aciertos / preguntas.length) * 100);
            const tituloRes = document.getElementById('titulo-resultados');
            const h3Puntaje = document.getElementById('puntuacion-final');
            const emoji = document.getElementById('medalla-emoji');
            
            h3Puntaje.innerText = `Calificación: ${porcentaje}% (${aciertos}/${preguntas.length})`;

            if (porcentaje >= 90) {
                tituloRes.innerText = "¡Excelente Trabajo!";
                h3Puntaje.style.color = "#059669"; // Verde Oscuro
                emoji.innerText = "🏆";
            } else if (porcentaje >= 60) {
                tituloRes.innerText = "¡Buen Intento!";
                h3Puntaje.style.color = "#D97706"; // Naranja
                emoji.innerText = "⭐";
            } else {
                tituloRes.innerText = "Hay que seguir practicando";
                h3Puntaje.style.color = "#DC2626"; // Rojo
                emoji.innerText = "💪";
            }
        }
    </script>
</body>
